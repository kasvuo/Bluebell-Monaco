name: Transfer original Drama Queen IMG8741 MP4
on:
  push:
    paths:
      - '.github/workflows/transfer-drama-queen-img8741-original.yml'
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact original video bytes and verify integrity
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from urllib.request import Request, urlopen
          from io import BytesIO
          from pathlib import Path
          import hashlib
          from PIL import Image
          url = 'https://cdn.shopify.com/s/files/1/0837/4521/0624/files/drama-queen-IMG8741-transfer-integrity-20260917.png?v=1789655730&format=png'
          request = Request(url, headers={'Accept': 'image/png'})
          with urlopen(request, timeout=90) as response:
              packet = response.read()
          image = Image.open(BytesIO(packet))
          assert image.size == (2048, 2239), f'Unexpected transfer dimensions: {image.size}'
          original = image.convert('L').tobytes()[:4584049]
          digest = hashlib.sha256(original).hexdigest()
          assert digest == '85fa8fbe2db390f596d60d3213c8bc36f8f79e64f316e678afc12fd12cb7f99b', f'Integrity check failed: {digest}'
          assert original[4:8] == b'ftyp'
          Path('bluebell-drama-queen-IMG8741-original-20260917.mp4').write_bytes(original)
          print(f'Original MP4 verified: {len(original)} bytes; SHA-256 {digest}')
          PY
          git config user.name 'bluebell-media-transfer'
          git config user.email 'actions@github.com'
          git add bluebell-drama-queen-IMG8741-original-20260917.mp4
          if ! git diff --cached --quiet; then
            git commit -m 'Add byte-identical original Drama Queen IMG8741 MP4'
            git push
          fi
